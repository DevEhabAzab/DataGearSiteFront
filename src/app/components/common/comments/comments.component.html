<div class="comments-area">
    <h3 class="comments-title">{{commentLength}} {{(commentLength>1?" Comments": "Comment") }} :</h3>
    
<app-comment-list [comments]="comments"></app-comment-list>

    <div class="comment-respond"  >
        <h3 class="comment-reply-title">Leave A Reply</h3>
        <p class="comment-notes"><span id="email-notes">Your email address will not be published.</span> Required fields are marked <span class="required">*</span></p>
        <form class="comment-form" [formGroup]="commentForm" (ngSubmit)="onSubmitComment()">
            <div class="row">
                <div class="col-lg-6 col-md-6 col-sm-6">
                    <div class="form-group">
                        <input type="text" class="form-control"  formControlName="name" name="name" id="name"  placeholder="Your Name">
                        <div *ngIf="commentForm.get('name')?.touched && commentForm.get('name')?.invalid" class="text-danger">
                            <small *ngIf="commentForm.get('name')?.errors?.['required']">Name is required.</small>
                          </div>
                    </div>
                </div>
                <div class="col-lg-6 col-md-6 col-sm-6">
                    <div class="form-group">
                        <input type="text" class="form-control"  formControlName="email" name="email" id="email"   placeholder="Your Email">
                        <div *ngIf="commentForm.get('email')?.touched && commentForm.get('email')?.invalid" class="text-danger">
                            <small *ngIf="commentForm.get('email')?.errors?.['required']">Email is required.</small>
                            <small *ngIf="commentForm.get('email')?.errors?.['email']">Invalid email format.</small>
                          </div>
                    </div>
                </div>
                <!-- <div class="col-lg-12 col-md-12 col-sm-12">
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Website">
                    </div>
                </div> -->
                <div class="col-lg-12 col-md-12 col-sm-12">
                    <div class="form-group">
                        <textarea class="form-control"  formControlName="comment" name="comment" id="comment"   cols="30" rows="5" placeholder="Your Comment..."></textarea>
                        <div *ngIf="commentForm.get('comment')?.touched && commentForm.get('comment')?.invalid" class="text-danger">
                            <small *ngIf="commentForm.get('comment')?.errors?.['required']">Comment is required.</small>
                          </div>
                    </div>
                </div>
                <!-- <div class="col-lg-12 col-md-12 col-sm-12">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="checkme">
                        <label class="form-check-label" for="checkme">
                            Save my name, email, and website in this browser for the next time I comment.
                        </label>
                    </div>
                </div> -->
                <div class="col-lg-12 col-md-12 col-sm-12">
                    <button type="submit" class="submit-btn" [disabled]="commentForm.invalid">Post A Comment</button>
                </div>
            </div>
        </form>
    </div>
</div>
